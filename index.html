<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>CEO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: phone column; fixed header, scrolling view, fixed bottom tab bar, bottom sheet for editing an operation */
  --bg:#08080a; --s1:#131214; --s2:#1d1b1e; --line:#2c282b;
  --text:#f6f1f1; --soft:#d9d0d2; --muted:#a39b9e; --dim:#8f8689;
  --red:#e3242d; --red2:#ff6b72; --redbg:rgba(229,37,46,.14); --green:#9fe0b0;
  --display:'Unbounded','Manrope',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;height:100%}
body{background:radial-gradient(120% 55% at 100% 0%,rgba(229,37,46,.12),transparent 60%) fixed,var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line);background:rgba(8,8,10,.92);backdrop-filter:blur(10px)}
.logo{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.logo b{color:var(--red)}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 8px}
.avawrap{margin-left:auto;position:relative;width:36px;height:36px;border:0;background:none;padding:0;flex:none}
.avawrap .dot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#6d6568;border:2px solid var(--bg)}
.dot.green{background:#3ecf72}.dot.red{background:var(--red)}.dot.amber{background:#ffcc66}
.ava{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--red);background:var(--s2);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:13px;flex:none}
main{flex:1;padding:16px 16px calc(104px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.dashed{border-style:dashed}
.num{font-family:var(--display);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:baseline;gap:8px}
.mut{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--s2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile.c{text-align:center;padding:10px 8px}
.tl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-self:flex-start;font-size:13px;font-weight:700;color:var(--red2);background:var(--redbg);border-radius:99px;padding:4px 10px}
.chip.ok{color:var(--muted);background:var(--s2)}
.tag{margin-left:auto;font-size:12px;font-weight:700;color:#fff;background:var(--red);border-radius:99px;padding:3px 9px;white-space:nowrap}
.tag.soft{color:var(--red2);background:var(--redbg)}
.tip{border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,rgba(229,37,46,.22),rgba(229,37,46,.04) 70%);border:1px solid rgba(229,37,46,.4)}
.tip .ava{margin:0;width:32px;height:32px;border:0}
.tip h4{margin:0;font-family:var(--display);font-size:13px;font-weight:600}
.tip p{margin:0;font-size:14px;color:var(--soft)}
.tip.loading p{color:var(--muted)}
.h1row{display:flex;align-items:center;gap:10px}
h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em}
.seg{margin-left:auto;display:flex;gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{border:0;padding:7px 10px;border-radius:12px;font-weight:700;font-size:13px;background:transparent;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--s2);color:var(--text)}
.bar{position:relative;height:8px;border-radius:8px;background:var(--s2)}
.bar>i{display:block;height:100%;border-radius:8px;background:var(--dim)}
.bar>i.hot{background:var(--red)}
.bar>u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);border-radius:2px}
.lim{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.lim .st{font-size:12px;font-weight:700;color:var(--muted)}
.lim .st.hot{font-weight:800;color:#fff;background:var(--red);border-radius:99px;padding:2px 8px}
.small{font-size:13px}
.legend{display:flex;flex-direction:column;gap:7px}
.legend>div{display:flex;align-items:center;gap:8px;font-size:13px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none;border:1px solid var(--line)}
.legend .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .df{width:56px;text-align:right;font-size:12px;font-weight:700;color:var(--muted)}
.legend .df.up{color:var(--red2)}
.search{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;color:var(--text);font:inherit;outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--s2);color:var(--muted);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
.fchip[aria-pressed=true]{border-color:var(--red);background:var(--redbg);color:var(--red2)}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:11px 12px}
.op .t{flex:1;min-width:0}
.op .t div:first-child{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.op .t div:last-child{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
.neg{color:var(--red2)} .pos{color:var(--green)} .own{color:var(--muted)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 8px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:15px;background:var(--s2);color:var(--text)}
.btn.red{background:var(--red);color:#fff}
.btn:disabled{opacity:.5}
.paybtn{flex:1;border:1px solid var(--line);background:var(--s2);color:var(--muted);border-radius:12px;padding:9px 4px;font-weight:800;font-size:13px}
.paybtn[aria-pressed=true]{border-color:var(--red);background:var(--red);color:#fff}
nav{position:fixed;left:8px;right:8px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;max-width:504px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:rgba(19,18,20,.96);border:1px solid var(--line);border-radius:24px;padding:6px;backdrop-filter:blur(10px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:16px;border:0;background:transparent;font-size:10px;font-weight:700;color:var(--muted);min-width:0}
nav button[aria-current=page]{color:var(--red2);background:var(--redbg)}
nav svg{width:22px;height:22px}
.shade{position:fixed;inset:0;background:rgba(8,6,10,.62);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:520px;margin:0 auto;max-height:86vh;overflow-y:auto;background:var(--s1);border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto;flex:none}
.sheet h2{font-family:var(--display);font-size:20px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{border:1px solid var(--line);background:var(--s2);color:var(--muted);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:700}
.cats button[aria-pressed=true]{border-color:var(--red);background:var(--redbg);color:var(--red2)}
.field{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;color:var(--text);width:100%;outline:none}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;background:var(--s2);border:1px solid var(--line);border-radius:99px;padding:9px 16px;font-weight:700;font-size:14px;white-space:nowrap}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:40px 24px;color:var(--muted)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--red);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.stale{font-size:12px;color:var(--muted);text-align:center}
a{color:var(--red2)}
.ava.big{width:48px;height:48px;margin:0}.ava.green{border-color:#3ecf72}.ava.amber{border-color:#ffcc66}.ava.red{border-color:var(--red)}
.back{display:inline-flex;align-self:flex-start;align-items:center;gap:4px;font-size:14px;font-weight:700;color:var(--red2);background:none;border:0;padding:0;margin-bottom:-6px}
.lnk{background:none;border:0;padding:0;color:var(--red2);font-weight:700;font-size:13px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:800;border-radius:99px;padding:3px 9px;background:var(--s2);color:var(--text);white-space:nowrap;border:1px solid transparent}
.badge.red{background:var(--red);color:#fff}.badge.green{background:rgba(62,207,114,.16);color:var(--green)}.badge.amber{background:rgba(255,204,102,.14);color:#ffcc66}.badge.ghost{background:transparent;color:var(--muted)}
button.badge{color:var(--muted)}
.brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%}
.brow .t{flex:1;min-width:0}.brow .t div:first-child{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brow .t div:last-child{font-size:12px;color:var(--muted)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font-size:14px}
.rank{width:22px;height:22px;border-radius:8px;background:var(--s2);color:var(--muted);font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}.rank.hot{background:var(--red);color:#fff}
.accrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px}
.nm1{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bill.late{border-color:var(--red)}.bill.dashed{border-style:dashed}
.bico{width:38px;height:38px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none;font-size:18px}
.btn.sm{padding:9px;font-size:13px;border-radius:12px}
.tline{display:grid;align-items:end;height:26px}
.tline .cell{justify-self:center;width:min(7px,70%);height:10px;border-radius:4px;background:var(--s2)}
.tline .cell.today{height:22px;background:var(--text)}.tline .cell.sal{height:22px;background:#3ecf72}.tline .cell.exp{height:22px;background:#6d6568}.tline .cell.due{height:22px;background:var(--red)}
.tlab{position:relative;height:14px;font-size:11px;font-weight:800}
.tlab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tlab .today{color:var(--text)}.tlab .sal{color:var(--green)}.tlab .exp{color:var(--muted)}.tlab .due{color:var(--red2)}
.grow{display:grid;grid-template-columns:112px minmax(0,1fr) 46px 40px;align-items:center;gap:8px;font-size:13px}
.grow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.grow .df{text-align:right;font-size:12px;font-weight:800}
.rc{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--s2);border:1px solid transparent;width:100%;text-align:left}
.rc.sel{background:var(--redbg);border-color:var(--red)}
.h2{font-family:var(--display);font-size:18px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.srow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px;background:#6d6568}
.sdot.green{background:#3ecf72;box-shadow:0 0 0 4px rgba(62,207,114,.15)}.sdot.red{background:var(--red);box-shadow:0 0 0 4px rgba(229,37,46,.18)}.sdot.amber{background:#ffcc66;box-shadow:0 0 0 4px rgba(255,204,102,.15)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" id="logo">CEO<b>.</b></div>
    <div class="pill">твои бабки</div>
    <button type="button" class="avawrap" data-go="status" aria-label="Состояние бота"><div class="ava" id="ava">C</div><span class="dot" id="dot"></span></button>
  </header>
  <main id="view"><div class="center"><div class="spin"></div>Загружаю…</div></main>
</div>
<nav id="nav" aria-label="Разделы"></nav>
<div id="layer"></div>

<script>
(() => {
'use strict';
const TZ = 'Europe/Riga';
const tg = window.Telegram && window.Telegram.WebApp;
const S = { data: null, tips: null, tab: 'main', spendM: null, limP: 'month', foodM: null, billM: null, product: null, rc: null, opF: 'all', opQ: '', opN: 120, pay: 10000, sheetOp: null, sheetCat: null, fresh: false };

// ---------- helpers ----------
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CUR = { EUR: '€', UAH: '₴', USD: '$', GBP: '£', PLN: 'zł' };
function money(v, cur = 'EUR', dec) {
  if (v == null || isNaN(v)) return '—';
  const d = dec != null ? dec : Math.abs(v) >= 1000 ? 0 : 2;
  let s = Math.abs(v).toFixed(d).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  s = s.replace(/,00$/, '');
  return (v < 0 ? '−' : '') + s + ' ' + (CUR[cur] || cur);
}
const parts = (t) => { const o = {}; new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(t)).forEach(p => o[p.type] = p.value); return o; };
const ymd = (t) => { const p = parts(t); return `${p.year}-${p.month}-${p.day}`; };
const ym = (t) => ymd(t).slice(0, 7);
const hm = (t) => { const p = parts(t); return `${p.hour}:${p.minute}`; };
const MN = ['январь', 'февраль', 'март', 'апрель', 'май', 'июнь', 'июль', 'август', 'сентябрь', 'октябрь', 'ноябрь', 'декабрь'];
const MS = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
const MD = ['январю', 'февралю', 'марту', 'апрелю', 'маю', 'июню', 'июлю', 'августу', 'сентябрю', 'октябрю', 'ноябрю', 'декабрю'];
const MG = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const mIdx = (key) => Number(key.slice(5, 7)) - 1;
const shiftM = (key, n) => { let y = +key.slice(0, 4), m = +key.slice(5, 7) + n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${String(m).padStart(2, '0')}`; };
const daysIn = (key) => new Date(Date.UTC(+key.slice(0, 4), +key.slice(5, 7), 0)).getUTCDate();
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const n1 = n % 10; return n > 10 && n < 20 ? c : n1 > 1 && n1 < 5 ? b : n1 === 1 ? a : c; };
const ago = (t) => { if (!t) return ''; const h = (Date.now() - t) / 36e5; return h < 1 ? 'обновлено только что' : h < 24 ? `обновлено ${Math.floor(h)} ч назад` : `обновлено ${Math.floor(h / 24)} дн. назад`; };
const haptic = (k) => { try { tg && tg.HapticFeedback && (k === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.selectionChanged()); } catch (e) { } };
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };

// ---------- API ----------
const qs = new URLSearchParams(location.search);
let API = qs.get('api') || store.get('ceo_api') || '';
if (qs.get('api')) store.set('ceo_api', qs.get('api'));
const INIT = (tg && tg.initData) || '';
async function api(params) {
  const u = API + (API.includes('?') ? '&' : '?') + new URLSearchParams({ ...params, init: INIT }).toString();
  const r = await fetch(u, { redirect: 'follow' });
  const j = await r.json();
  if (!j.ok) { const e = new Error(j.error || 'error'); e.code = j.error; throw e; }
  return j;
}

// ---------- derived data ----------
const curKey = () => ym(S.data.now);
const opsIn = (key) => S.data.ops.filter(o => ym(o.t) === key);
function spendBy(list) { const by = {}; list.forEach(o => { if (o.k === 'расход') by[o.cat] = (by[o.cat] || 0) - o.e; }); return by; }
const sum = (o) => Object.values(o).reduce((s, v) => s + v, 0);
const hasMonth = (key) => S.data.ops.some(o => ym(o.t) === key);

// ---------- icons ----------
const IC = {
  main: '<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
  spend: '<circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 5"/>',
  limits: '<path d="M4 7h10M4 12h16M4 17h7"/>',
  bills: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  food: '<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 2-2 6 0 8v10"/>',
  debt: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>',
};
const TABS = [['main', 'Главная'], ['spend', 'Траты'], ['limits', 'Лимиты'], ['food', 'Еда'], ['bills', 'Счета'], ['debt', 'Долг']];
const PARENT = { ops: 'spend', product: 'food', receipts: 'food', status: 'main' };
function renderNav() {
  $('nav').innerHTML = TABS.map(([k, l]) => `<button type="button" data-tab="${k}" ${(PARENT[S.tab] || S.tab) === k ? 'aria-current="page"' : ''}><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg><span>${l}</span></button>`).join('');
}
$('nav').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
function go(tab) { if (S.tab !== tab) haptic(); S.tab = tab; renderNav(); render(); window.scrollTo(0, 0); }

const avaHtml = (cls = 'ava') => S.data && S.data.avatar ? `<img class="${cls}" src="${S.data.avatar}" alt="">` : `<div class="${cls}">${esc((S.data && S.data.bot || 'CEO').slice(0, 1))}</div>`;
function tipHtml(key) {
  if (S.tips === false) return '';
  const t = S.tips && S.tips[key];
  if (S.tips && !t) return '';

// Зарплата — на 5-й рабочий день месяца (выходные и праздники Латвии не считаются)

const PAL = ['#e3242d', '#ff6b72', '#ffb3b7', '#8a1a20', '#6d6568', '#463f42', '#2f2a2d'];
function donut(slices, total, label) {
  const R = 58, C = 75; let a0 = -Math.PI / 2; const gap = 0.02;
  const paths = slices.map((s, i) => {
    const frac = s.v / total; if (frac <= 0) return '';
    const a1 = a0 + frac * Math.PI * 2;
    const st = a0 + (slices.length > 1 ? gap / 2 : 0), en = a1 - (slices.length > 1 ? gap / 2 : 0);
    a0 = a1;
    if (frac >= 0.999) return `<circle cx="${C}" cy="${C}" r="${R}" stroke="${PAL[i]}" stroke-width="20" fill="none"/>`;
    const p = (a) => `${(C + R * Math.cos(a)).toFixed(2)} ${(C + R * Math.sin(a)).toFixed(2)}`;
    return `<path d="M ${p(st)} A ${R} ${R} 0 ${en - st > Math.PI ? 1 : 0} 1 ${p(en)}" stroke="${PAL[i]}" stroke-width="20" fill="none"/>`;
  }).join('');
  return `<svg role="img" aria-label="Расходы по категориям, всего ${esc(money(total, 'EUR', 0))}" width="150" height="150" viewBox="0 0 150 150" style="flex:none">${paths}<text x="75" y="72" text-anchor="middle" fill="#f6f1f1" font-family="Unbounded, sans-serif" font-weight="700" font-size="${total >= 10000 ? 14 : 17}">${esc(money(total, 'EUR', 0))}</text><text x="75" y="92" text-anchor="middle" fill="#a39b9e" font-family="Manrope, sans-serif" font-weight="700" font-size="11">${label}</text></svg>`;
}
function vSpend() {
  const cur = curKey();
  const months = [shiftM(cur, -2), shiftM(cur, -1), cur].filter(hasMonth);
  if (!S.spendM || !months.includes(S.spendM)) S.spendM = cur;
  const key = S.spendM, prevKey = shiftM(key, -1);
  // текущий месяц сравниваем с тем же числом прошлого: 1–4 ноября против 1–4 октября
  const today = Number(ymd(S.data.now).slice(8)), partial = key === cur;
  const by = spendBy(opsIn(key));
  const prev = hasMonth(prevKey) ? spendBy(opsIn(prevKey).filter(o => !partial || Number(ymd(o.t).slice(8)) <= today)) : null;
  const total = sum(by), ptotal = prev ? sum(prev) : null;
  const cats = Object.keys(by).filter(c => by[c] > 0.005).sort((a, b) => by[b] - by[a]);
  const top = cats.slice(0, 6), rest = cats.slice(6);
  const slices = top.map(c => ({ c, v: by[c] }));
  if (rest.length) slices.push({ c: 'Остальное', v: rest.reduce((s, c) => s + by[c], 0), rest });
  const seg = `<div class="seg" role="group" aria-label="Месяц">${months.map(m => `<button type="button" data-m="${m}" aria-pressed="${m === key}">${MS[mIdx(m)]}</button>`).join('')}</div>`;
  if (!cats.length) return `<div class="h1row"><h1>Траты</h1>${seg}</div><div class="card"><div class="empty">В этом месяце трат пока нет.</div></div>`;
  const legend = slices.map((s, i) => {

    if (prev) {

      if (pv < 0.5) { df = 'новое'; cls = 'up'; } else { const d = s.v - pv; df = Math.abs(d) < 0.5 ? 'как было' : (d > 0 ? '+' : '−') + money(Math.abs(d), 'EUR', 0); cls = d >= 0.5 ? 'up' : ''; }
    }
    return `<div><span class="sw" style="background:${PAL[i]}"></span><span class="nm">${esc(s.c)}</span><b class="amt">${money(s.v, 'EUR', 0)}</b>${prev ? `<span class="df ${cls}">${df}</span>` : ''}</div>`;
  }).join('');
  let cmp = '';
  if (ptotal) {
    const pct = Math.round((total - ptotal) / ptotal * 100);
    cmp = `<div style="display:flex;flex-direction:column;gap:4px"><div class="tl" style="font-size:12px">${partial ? `к 1–${today} ${MG[mIdx(prevKey)].slice(0, 3)}` : 'к ' + MD[mIdx(prevKey)]}</div><div class="num ${pct > 0 ? 'neg' : ''}" style="font-size:24px;${pct <= 0 ? 'color:#9fe0b0' : ''}">${pct > 0 ? '+' : pct < 0 ? '−' : ''}${Math.abs(pct)}%</div><div class="small mut">${money(ptotal, 'EUR', 0)} → ${money(total, 'EUR', 0)}</div></div>`;
  }
  // daily bars
  const dim = daysIn(key), daily = Array(dim).fill(0), dayTop = Array(dim).fill(null);
  opsIn(key).forEach(o => { if (o.k !== 'расход') return; const d = Number(ymd(o.t).slice(8)) - 1; daily[d] -= o.e; if (!dayTop[d] || -o.e > -dayTop[d].e) dayTop[d] = o; });
  const max = Math.max(...daily, 1), W = 326, bw = (W - 2) / dim, peaks = daily.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]).slice(0, 2).filter(p => p[0] > 0 && p[0] >= max * 0.35).map(p => p[1]);
  const bars = daily.map((v, i) => { const h = Math.max(2, v / max * 76); return `<rect x="${(1 + i * bw).toFixed(1)}" y="${(90 - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${peaks.includes(i) ? '#e3242d' : '#5a5356'}"/>`; }).join('');
  const labels = peaks.map((i, n) => {
    const x = 1 + i * bw + bw / 2, right = x > W * 0.6, h = Math.max(2, daily[i] / max * 76);
    const t = `${i + 1} ${MG[mIdx(key)].slice(0, 3)} · ${money(daily[i], 'EUR', 0)}${dayTop[i] && -dayTop[i].e > daily[i] * 0.6 ? ' (' + dayTop[i].cat.split(' ')[0].toLowerCase() + ')' : ''}`;
    const y = n === 0 ? 10 : Math.min(90 - h - 4, 44);
    return `<text x="${(right ? x - bw : x + bw).toFixed(1)}" y="${y}" fill="${n === 0 ? '#ff6b72' : '#a39b9e'}" font-family="Manrope, sans-serif" font-size="11" font-weight="800" text-anchor="${right ? 'end' : 'start'}">${esc(t)}</text>`;
  }).join('');
  const mid = Math.ceil(dim / 2);
  const daySvg = `<svg role="img" aria-label="Траты по дням" width="100%" viewBox="0 0 ${W} 106">${bars}${labels}<text x="0" y="104" fill="#a39b9e" font-family="Manrope, sans-serif" font-size="11">1</text><text x="${(1 + (mid - 1) * bw + bw / 2).toFixed(1)}" y="104" fill="#a39b9e" font-family="Manrope, sans-serif" font-size="11" text-anchor="middle">${mid}</text><text x="${W}" y="104" fill="#a39b9e" font-family="Manrope, sans-serif" font-size="11" text-anchor="end">${dim}</text></svg>`;
  return `<div class="h1row"><h1>Траты</h1>${seg}</div>
  <section class="card"><div style="display:flex;align-items:center;gap:12px">${donut(slices, total, MN[mIdx(key)])}${cmp}</div><div class="legend">${legend}</div></section>
  <section class="card"><div style="display:flex;align-items:center"><div class="eyebrow">По дням</div><button type="button" class="lnk" data-go="ops" style="margin-left:auto">Все операции →</button></div>${daySvg}</section>
  ${key === cur ? tipHtml('spend') : ''}`;
}

    const dow = (new Date(today + 'T12:00:00Z').getUTCDay() + 6) % 7; // 0 = пн
    const start = new Date(Date.parse(today + 'T00:00:00Z') - dow * 864e5).toISOString().slice(0, 10);
    list = S.data.ops.filter(o => ymd(o.t) >= start && ymd(o.t) <= today);
    frac = (dow + 1) / 7; k = 7 / dim; label = 'эта неделя';
  }
  const by = spendBy(list);
  const keys = Object.keys(lim);
  if (!keys.length) return `<div class="h1row"><h1>Лимиты</h1>${seg}</div>
    <div class="card dashed"><b>Лимитов пока нет</b><div class="small mut">Впиши суммы в таблицу: лист «Бюджет», колонка «Лимит в месяц, €». Тут сразу появятся полоски, а бот начнёт палить перебор в каждом сообщении.</div>${S.data.sheetUrl ? `<button type="button" class="btn red" data-open="${esc(S.data.sheetUrl)}">Открыть таблицу</button>` : ''}</div>
    ${noLimitList(by, keys)}`;
  const rows = keys.map(c => ({ c, l: lim[c] * k, s: Math.max(0, by[c] || 0) })).sort((a, b) => b.s / b.l - a.s / a.l);
  const tot = rows.reduce((s, r) => s + r.l, 0), spent = rows.reduce((s, r) => s + r.s, 0);
  const body = rows.map(r => {
    const ratio = r.s / r.l, over = ratio > 1, fast = !over && r.s > 0 && ratio > frac + 0.05;
    const st = over ? `<span class="st hot">перебор ${money(r.s - r.l, 'EUR', 0)}</span>` : fast ? '<span class="st hot">быстрее плана</span>' : '<span class="st">в норме</span>';
    return `<div class="lim"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1;min-width:0">${esc(r.c)}</b>${st}</div>
      <div class="bar"><i class="${over || fast ? 'hot' : ''}" style="width:${Math.min(100, ratio * 100).toFixed(1)}%"></i><u style="left:${(frac * 100).toFixed(1)}%"></u></div>
      <div style="display:flex" class="small mut"><span>${money(r.s)} из ${money(r.l)}</span><span style="margin-left:auto">${over ? 'сверху ' + money(r.s - r.l) : 'осталось ' + money(r.l - r.s)}</span></div></div>`;
  }).join('');
  return `<div class="h1row"><h1>Лимиты</h1>${seg}</div>
  <div class="small mut" style="display:flex;gap:8px;align-items:flex-start"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg><span>Белая черта — сколько ${week ? 'недели' : 'месяца'} уже прошло. Обогнал черту — тратишь быстрее плана.${week ? ' Недельный лимит = месячный × 7 / дней в месяце.' : ''}</span></div>
  <section class="card" style="gap:0"><div class="row" style="padding-bottom:10px"><div class="num" style="font-size:26px">${money(spent, 'EUR', 0)}</div><span class="mut">из ${money(tot, 'EUR', 0)} · ${label}</span></div>${body}</section>
  ${noLimitList(by, keys)}`;
}
function noLimitList(by, keys) {
  const rest = Object.keys(by).filter(c => !keys.includes(c) && by[c] > 0.5).sort((a, b) => by[b] - by[a]);
  if (!rest.length) return '';
  return `<section class="card"><div class="eyebrow">Без лимита</div><div class="legend">${rest.map(c => `<div><span class="nm">${esc(c)}</span><b class="amt">${money(by[c])}</b></div>`).join('')}</div></section>`;
}

function opMatches(o) {
  const f = S.opF;
  if (f === 'exp' && !(o.k === 'расход' && o.e < 0)) return false;
  if (f === 'inc' && o.k !== 'доход') return false;
  if (['Mono', 'Swedbank', 'Revolut'].includes(f) && !o.a.startsWith(f)) return false;
  const q = S.opQ.trim().toLowerCase();
  if (q && !(o.d + ' ' + o.cat + ' ' + o.a + ' ' + o.n).toLowerCase().includes(q)) return false;
  return true;
}
function amtHtml(o) {
  const cls = o.k === 'свои' ? 'own' : o.amt > 0 ? 'pos' : 'neg';
  const main = (o.amt > 0 ? '+' : '') + money(o.amt, o.c);
  return `<b class="amt ${cls}">${main}</b>`;
}
function opsListHtml() {
  const list = S.data.ops.filter(opMatches).sort((a, b) => b.t - a.t);
  const today = ymd(S.data.now), yday = ymd(S.data.now - 864e5);
  let html = '', last = '';
  list.slice(0, S.opN).forEach(o => {
    const d = ymd(o.t);
    if (d !== last) { last = d; const lbl = `${+d.slice(8)} ${MG[+d.slice(5, 7) - 1]}`; html += `<div class="eyebrow" style="margin-top:4px">${d === today ? 'Сегодня, ' + lbl : d === yday ? 'Вчера, ' + lbl : lbl}</div>`; }
    const time = o.s === 'Enable Banking' ? '' : ' ' + hm(o.t);
    html += `<button type="button" class="op" data-op="${esc(o.id)}"><div class="t"><div>${esc(o.d)}</div><div>${esc(o.a)}${time} · ${esc(o.cat)}${o.n ? ' · ✎ ' + esc(o.n) : ''}</div></div>${amtHtml(o)}</button>`;
  });
  if (list.length > S.opN) html += `<button type="button" class="btn" data-more="1">Показать ещё</button>`;
  return html || '<div class="empty">Ничего не нашёл</div>';
}
function vOps() {
  const F = [['all', 'Все'], ['exp', 'Расходы'], ['inc', 'Доходы'], ['Mono', 'Mono'], ['Swedbank', 'Swedbank'], ['Revolut', 'Revolut']];
  return `${backLink('spend', 'Траты')}<div class="h1row"><h1>Операции</h1></div>
  <label class="search"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Rimi, Bolt, кафе…" value="${esc(S.opQ)}" aria-label="Поиск" autocomplete="off"></label>
  <div class="chips">${F.map(([k, l]) => `<button type="button" class="fchip" data-f="${k}" aria-pressed="${S.opF === k}">${l}</button>`).join('')}</div>
  <div id="oplist" style="display:flex;flex-direction:column;gap:8px">${opsListHtml()}</div>`;
}

const RATE = 0.062; // штрафная ставка из договора Mono, % в месяц
function payoff(debt, pay) {
  const pts = [debt]; let b = debt, interest = 0, m = 0;
  while (b > 0 && m < 60) { const i = b * RATE; interest += i; b = Math.max(0, b + i - pay); pts.push(b); m++; if (pay <= i) return { never: true, pts, interest }; }
  return { months: m, pts, interest, never: b > 0 };
}
function vDebt() {
  const d = debtStats();
  if (!d) return `<div class="h1row"><h1>Долг</h1></div><div class="card"><div class="empty">Данных по чёрной карте Mono пока нет.</div></div>`;
  if (d.uah <= 0) return `<div class="h1row"><h1>Долг</h1></div>${debtCard(false)}`;
  const opts = [5000, 10000, 15000, 20000];
  const sel = payoff(d.uah, S.pay), base = payoff(d.uah, S.pay === 5000 ? 10000 : 5000);
  const now = S.data.now, ck = ym(now);
  const N = Math.min(18, Math.max(sel.never ? 12 : sel.months, 6));
  const W = 326, x = (i) => 10 + i * (W - 20) / N, y = (v) => 12 + (1 - v / d.uah) * 104;
  const line = (pts) => pts.slice(0, N + 1).map((v, i) => `${i ? 'L' : 'M'} ${x(i).toFixed(1)} ${y(Math.min(v, d.uah * 1.0)).toFixed(1)}`).join(' ');
  const step = N > 9 ? 3 : N > 6 ? 2 : 1;
  const labels = Array.from({ length: N + 1 }, (_, i) => i).filter(i => i % step === 0).map(i => `<text x="${x(i).toFixed(1)}" y="136" text-anchor="middle" fill="#a39b9e" font-family="Manrope, sans-serif" font-size="11" font-weight="700">${MS[mIdx(shiftM(ck, i))]}</text>`).join('');
  const svg = `<svg role="img" aria-label="Прогноз долга" width="100%" viewBox="0 0 ${W} 140">${[12, 64, 116].map(v => `<line x1="0" x2="${W}" y1="${v}" y2="${v}" stroke="#2c282b"/>`).join('')}
    <path d="${line(base.pts)}" fill="none" stroke="#8f8689" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="${line(sel.pts)}" fill="none" stroke="#e3242d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${sel.pts.slice(0, N + 1).map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="#e3242d"/>`).join('')}${labels}</svg>`;
  const done = sel.never ? 'не закроешь' : (() => { const k = shiftM(ck, sel.months); return MN[mIdx(k)] + ' ' + k.slice(0, 4); })();
  const hist = d.hist.length >= 2 ? (() => { const first = d.hist[0]; const diff = d.uah - first[1]; return `<div class="small mut">С ${+ymd(first[0]).slice(8)} ${MG[mIdx(ym(first[0]))]}: ${diff >= 0 ? '+' : '−'}${money(Math.abs(diff), 'UAH', 0)}</div>`; })() : '';
  const intr = d.interest.slice().sort((a, b) => a.t - b.t).slice(-4);
  return `<div class="h1row"><h1>Долг</h1></div>
  ${debtCard(false).replace('</section>', hist + '</section>')}
  <section class="card"><div style="display:flex;align-items:center"><b style="flex:1">Когда закроешь</b><span class="small mut">вношу в месяц</span></div>
    <div style="display:flex;gap:8px">${opts.map(o => `<button type="button" class="paybtn" data-pay="${o}" aria-pressed="${S.pay === o}">${money(o, 'UAH', 0)}</button>`).join('')}</div>
    ${svg}
    <div class="grid2"><div class="tile"><div class="tl">свободен</div><div class="num" style="font-size:16px;color:#ff6b72">${done}</div></div><div class="tile"><div class="tl">проценты банку</div><div class="num" style="font-size:16px">${sel.never ? '∞' : '~' + money(Math.round(sel.interest / 100) * 100, 'UAH', 0)}</div></div></div>
    <div class="small mut">Пунктир — ${money(S.pay === 5000 ? 10000 : 5000, 'UAH', 0)} в месяц. Считаю по штрафной ставке 6,2% в месяц, без новых трат с кредитки.</div></section>
  ${intr.length ? `<section class="card"><div class="eyebrow">Проценты за превышение лимита</div>${intr.map((i, n) => `<div style="display:flex;font-size:14px"><span style="flex:1">${+ymd(i.t).slice(8)} ${MG[mIdx(ym(i.t))]}</span><b class="amt ${n === intr.length - 1 ? 'neg' : ''}">${money(i.amt, 'UAH')}</b></div>`).join('')}</section>` : ''}`;
}

// ---------- sheet: edit operation ----------
function openSheet(id) {
  const o = S.data.ops.find(x => x.id === id); if (!o) return;
  S.sheetOp = o; S.sheetCat = o.cat; haptic();
  const c = S.data.cats;
  const list = o.amt < 0 ? [...c.exp, ...c.sp] : [...c.inc, ...c.sp, ...c.exp];
  const p = parts(o.t);
  $('layer').innerHTML = `<div class="shade" data-close="1"></div><section class="sheet" role="dialog" aria-label="Изменить операцию"><div class="grab"></div>
    <div style="display:flex;align-items:baseline;gap:10px"><h2>${esc(o.d)}</h2>${amtHtml(o).replace('class="amt', 'style="font-family:var(--display);font-size:20px" class="amt')}</div>
    <div class="small mut">${esc(o.a)} · ${+p.day} ${MG[+p.month - 1]}${o.s === 'Enable Banking' ? '' : ' ' + hm(o.t)} · ${esc(o.s)}${o.c !== 'EUR' ? ' · ≈ ' + money(o.e) : ''}</div>
    ${o.ai ? `<div class="small" style="color:var(--soft)">💬 ${esc(o.ai)}</div>` : ''}
    <div class="eyebrow">Категория</div><div class="cats" id="cats">${list.map(x => `<button type="button" data-cat="${esc(x)}" aria-pressed="${x === o.cat}">${esc(x)}</button>`).join('')}</div>
    <div class="eyebrow">Заметка</div><input id="note" class="field" type="text" maxlength="200" placeholder="Например: подарок Аманде" value="${esc(o.n)}" aria-label="Заметка">
    <div class="grid2"><button type="button" class="btn" data-close="1">Отмена</button><button type="button" class="btn red" id="save">Сохранить</button></div></section>`;
  try { tg && tg.BackButton.show(); } catch (e) { }
}
function closeSheet() { $('layer').innerHTML = ''; S.sheetOp = null; try { tg && tg.BackButton.hide(); } catch (e) { } }
async function saveSheet() {
  const o = S.sheetOp; if (!o) return;
  const note = $('note').value.trim(), cat = S.sheetCat;
  if (cat === o.cat && note === o.n) { closeSheet(); return; }
  const b = $('save'); b.disabled = true; b.textContent = 'Сохраняю…';
  try {
    const r = await api({ api: 'setcat', id: o.id, cat, note });
    o.cat = r.op.cat; o.k = r.op.k; o.n = r.op.n != null ? r.op.n : note;
    cacheData(); closeSheet(); render(); toast('Сохранено'); haptic('ok');
    S.tips = null; loadTips();
  } catch (e) { b.disabled = false; b.textContent = 'Сохранить'; toast(e.code === 'auth' ? 'Открой приложение заново' : 'Не сохранилось: ' + e.message); }
}
async function markPaid(id, btn) {
  const b = S.data.bills.find(x => x.id === id); if (!b) return;
  const ok = await new Promise(res => { try { if (tg && tg.showConfirm) return tg.showConfirm(`${b.prov}: ${money(b.amt)} — отметить оплаченным?`, res); } catch (e) { } res(true); });
  if (!ok) return;
  btn.disabled = true; btn.textContent = 'Отмечаю…';
  try {
    const r = await api({ api: 'billpaid', id });
    Object.assign(b, { status: r.bill.status, paid: r.bill.paid, op: r.bill.op });
    cacheData(); render(); toast('Вычеркнул'); haptic('ok');
  } catch (e) { btn.disabled = false; btn.textContent = 'Я оплатил'; toast(e.code === 'auth' ? 'Открой приложение заново' : 'Не получилось: ' + e.message); }
}
let toastT;
function toast(t) { let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200); }

// ---------- events ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-m],[data-lp],[data-fm],[data-bm],[data-f],[data-op],[data-more],[data-pay],[data-cat],[data-close],#save,[data-open],[data-retry],[data-product],[data-rc],[data-paid],[data-rcall]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.go) go(ds.go);
  else if (ds.m) { S.spendM = ds.m; haptic(); render(); }
  else if (ds.lp) { S.limP = ds.lp; haptic(); render(); }
  else if (ds.fm) { S.foodM = ds.fm; haptic(); render(); }
  else if (ds.bm) { S.billM = ds.bm; haptic(); render(); }
  else if (ds.product) { S.product = ds.product; go('product'); }
  else if (ds.rc) { S.rc = ds.rc; haptic(); render(); const c = $('rcdetail'); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  else if (ds.rcall) { S.rcAll = true; render(); }
  else if (ds.paid) markPaid(ds.paid, t);
  else if (ds.f) { S.opF = ds.f; S.opN = 120; haptic(); render(); }
  else if (ds.op) openSheet(ds.op);
  else if (ds.more) { S.opN += 200; const l = $('oplist'); if (l) l.innerHTML = opsListHtml(); }
  else if (ds.pay) { S.pay = Number(ds.pay); haptic(); render(); }
  else if (ds.cat) { S.sheetCat = ds.cat; haptic(); document.querySelectorAll('#cats [data-cat]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cat === ds.cat)); }
  else if (ds.close) closeSheet();
  else if (t.id === 'save') saveSheet();
  else if (ds.open) { try { tg && tg.openLink ? tg.openLink(ds.open) : window.open(ds.open); } catch (err) { window.open(ds.open); } }
  else if (ds.retry) boot();
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.opQ = e.target.value; S.opN = 120; const l = $('oplist'); if (l) l.innerHTML = opsListHtml(); }
});

// ---------- render & boot ----------
function render() {
  if (!S.data) return;
  const v = { main: vMain, spend: vSpend, limits: vLimits, ops: vOps, food: vFood, bills: vBills, debt: vDebt, product: vProduct, receipts: vReceipts, status: vStatus }[S.tab]();
  $('view').innerHTML = v + (S.fresh ? '' : '<div class="stale">Показываю сохранённое, обновляю…</div>');
}
function paintHeader() {
  $('logo').innerHTML = esc(S.data.bot || 'CEO') + '<b>.</b>';
  const a = $('ava');
  if (S.data.avatar) { const img = document.createElement('img'); img.className = 'ava'; img.id = 'ava'; img.alt = ''; img.src = S.data.avatar; a.replaceWith(img); }
  else a.textContent = (S.data.bot || 'C').slice(0, 1);
  const h = health();
  $('dot').className = 'dot ' + (h.bad ? 'red' : h.warn ? 'amber' : 'green');
  $('dot').parentElement.setAttribute('aria-label', 'Состояние бота: ' + (h.bad ? 'есть сбои' : 'всё работает'));
}
function cacheData() { store.set('ceo_data', JSON.stringify(S.data)); }
function fail(msg, retry) { $('view').innerHTML = `<div class="center"><div style="font-size:34px">🤨</div><div>${msg}</div>${retry ? '<button type="button" class="btn red" data-retry="1">Ещё раз</button>' : ''}</div>`; }
async function loadTips() {
  try { const r = await api({ api: 'tips' }); S.tips = r.tips && (r.tips.main || r.tips.spend || r.tips.food) ? r.tips : false; }
  catch (e) { S.tips = false; }
  render();
}
async function boot() {
  if (!API) return fail('Открой приложение из бота CEO — кнопкой «Открыть» или командой /app.');
  if (!INIT) return fail('Это приложение работает только внутри Telegram. Открой его из бота CEO.');
  const cached = store.get('ceo_data');
  if (cached && !S.data) { try { S.data = JSON.parse(cached); if (!S.data.bills || !S.data.receipts) throw 0; S.fresh = false; paintHeader(); render(); } catch (e) { } }
  try {
    const r = await api({ api: 'data' });
    S.data = r.data; S.fresh = true; cacheData(); paintHeader(); render(); loadTips();
  } catch (e) {
    if (S.data) { S.fresh = true; render(); toast(e.code === 'auth' ? 'Сессия устарела — открой заново' : 'Нет связи, показываю сохранённое'); return; }
    if (e.code === 'auth') fail('Не узнал тебя. Закрой приложение и открой заново из бота CEO.');
    else fail('Не смог достучаться до таблицы. ' + esc(e.message || ''), true);
  }
}
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor('#08080a'); tg.setBackgroundColor('#08080a'); tg.setBottomBarColor && tg.setBottomBarColor('#08080a'); } catch (e) { }
  try { tg.BackButton.onClick(closeSheet); } catch (e) { }
}
renderNav();
boot();
})();
</script>
</body>
</html>
